name: FE CI

on:
  push:
    paths:
      - "FE/**"
      - ".github/workflows/fe-ci.yml"
  pull_request:
    paths:
      - "FE/**"
      - ".github/workflows/fe-ci.yml"

defaults:
  run:
    working-directory: FE

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - name: Install
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
